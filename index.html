<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. João Paulo Cardozo | Fisioterapeuta</title>
    <style>
        :root {
            --primary-color: #004aad; /* Azul Profissional - Fisioterapia */
            --whatsapp-color: #25D366; /* Verde WhatsApp */
            --bg-color: #f0f2f5;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            color: var(--text-color);
            min-height: 100vh;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeIn 1s ease-in;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            padding: 3px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 700;
            color: #1a1a1a;
        }

        p {
            font-size: 0.95rem;
            color: #666;
            margin: 5px 0 0 0;
            font-weight: 500;
        }

        .crefito {
            font-size: 0.8rem;
            color: #888;
            margin-top: 2px;
        }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #e1e1e1;
            position: relative;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Botão WhatsApp */
        .btn-whatsapp {
            background-color: var(--whatsapp-color);
            color: white;
            border: none;
        }
        .btn-whatsapp:hover {
            background-color: #1ebc57;
        }

        /* Botão Destaque (Tornozelo) */
        .btn-destaque {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-left: 5px solid #003380;
        }
        .btn-destaque:hover {
            background-color: #003d91;
        }

        /* Ícones (Emojis) */
        .icon {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #999;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="profile-container">
        <img src="foto-jp.jpg" alt="Dr. João Paulo Cardozo" class="profile-pic">
        
        <h1>Dr. João Paulo Cardozo</h1>
        <p>Fisioterapeuta</p>
        <p class="crefito">CREFITO-2 / 362213-F</p>
    </div>

    <div class="links-container">
        
        <a href="https://wa.me/5521972183072?text=Ol%C3%A1%20Dr.%20Jo%C3%A3o%2C%20vim%20pelo%20Instagram%20e%20gostaria%20de%20agendar%20uma%20consulta." class="btn btn-whatsapp" target="_blank">
            <span class="icon">📅</span> Agendar Consulta (WhatsApp)
        </a>

        <a href="https://paginadevendas.vercel.app/" class="btn btn-destaque" target="_blank">
            <span class="icon">🦶</span> Guia do Tornozelo (Método Completo)
        </a>

        <a href="https://hotmart.com/pt-br/marketplace/produtos/como-cuidar-da-coluna-e-evitar-dores-no-home-office-passo-a-passo-simples/O101307592F" class="btn" target="_blank">
            <span class="icon">📚</span> Ebook: Coluna sem Dor no Home Office
        </a>

    </div>

    <div class="footer">
        © 2025 Dr. João Paulo Cardozo<br>
        Recuperando sua confiança e movimento.
    </div>

</body>
</html>
